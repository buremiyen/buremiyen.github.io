<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="Burhan Emin Yenier — Graphic Designer, 3D Artist and Game Developer.">
<meta property="og:title" content="Burhan Emin Yenier">
<meta property="og:description" content="Graphic Designer · 3D Artist · Game Developer">

<link rel="apple-touch-icon" href="IMG_0271.jpg">
<title>Burhan Emin Yenier</title>
<style>
:root{--text:#f5f5f7;--muted:#8e8e93;--ease:cubic-bezier(.22,.61,.36,1);--page-bg:#000000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--page-bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}
body{min-height:100svh;overflow-x:hidden;background:radial-gradient(circle at 50% -8%,rgba(255,255,255,.10),transparent 25%),radial-gradient(circle at 12% 35%,rgba(255,255,255,.025),transparent 20%),radial-gradient(circle at 88% 72%,rgba(255,255,255,.018),transparent 22%),var(--page-bg);-webkit-font-smoothing:antialiased}
.page{width:min(720px,100%);margin:0 auto;padding:14px 10px calc(30px + env(safe-area-inset-bottom))}
.profile-card{position:relative;z-index:10;min-height:360px;overflow:hidden;border-radius:34px;border:1px solid rgba(255,255,255,.13);background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.10),transparent 22%),radial-gradient(circle at 14% 12%,rgba(255,255,255,.05),transparent 24%),linear-gradient(145deg,#171719,#080809);box-shadow:0 28px 90px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .8s var(--ease),opacity .7s ease,filter .7s ease}
.profile-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(145deg,rgba(255,255,255,.15),transparent 38%,rgba(255,255,255,.025) 74%)}
.profile-inner{position:relative;z-index:1;min-height:360px;padding:30px 20px 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.logo-ring{width:108px;height:108px;margin-bottom:22px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#050506;border:1px solid rgba(255,255,255,.15);box-shadow:0 18px 52px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
.logo-ring img{width:86%;height:auto;display:block}.profile-name{margin:0;font-size:clamp(30px,7vw,48px);line-height:1.02;font-weight:700;letter-spacing:-.05em}.profile-role{margin:14px 0 0;color:rgba(255,255,255,.84);font-size:15px;line-height:1.5}.profile-chip{margin-top:19px;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.05);color:rgba(255,255,255,.65);font-size:10px;letter-spacing:.10em}
.stack-section{position:relative;z-index:1;margin-top:-34px}.wallet{position:relative;height:560px;perspective:1200px}.card{--i:0;--peek:58px;--base:-22px;position:absolute;left:0;right:0;top:calc(var(--base) + var(--i) * var(--peek));height:126px;overflow:hidden;border-radius:28px;border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 50px rgba(0,0,0,.44),inset 0 1px 0 rgba(255,255,255,.10);transition:height .42s var(--ease),transform .42s var(--ease),box-shadow .32s ease,opacity .55s ease,filter .55s ease;cursor:pointer;user-select:none;touch-action:manipulation}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(145deg,rgba(255,255,255,.15),transparent 38%,rgba(255,255,255,.025) 76%)}
.card[data-order="0"]{z-index:7}.card[data-order="1"]{z-index:6}.card[data-order="2"]{z-index:5}.card[data-order="3"]{z-index:4}.card[data-order="4"]{z-index:3}.card[data-order="5"]{z-index:2}.card[data-order="6"]{z-index:1}.card:hover{box-shadow:0 24px 74px rgba(0,0,0,.56),inset 0 1px 0 rgba(255,255,255,.14)}.card.active{height:156px;box-shadow:0 28px 82px rgba(0,0,0,.60),inset 0 1px 0 rgba(255,255,255,.18)}.card.shifted{transform:translateY(var(--shift,30px))}.card.active .row{transform:translateY(18px)}.card.active .open{transform:scale(1.05);background:rgba(255,255,255,.18)}.card.active .copy strong{transform:translateY(1px)}
.row{position:relative;z-index:1;height:100%;padding:70px 16px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;transition:transform .42s var(--ease)}.left{min-width:0;display:flex;align-items:center;gap:12px}.icon{width:42px;height:42px;flex:0 0 42px;border-radius:14px;display:grid;place-items:center;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 16px rgba(0,0,0,.18);color:inherit}.icon svg{width:22px;height:22px;display:block;fill:currentColor}.icon svg.stroke{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.behance-mark{font-size:18px;line-height:1;font-weight:800;letter-spacing:-.06em;transform:translateY(-1px)}.copy{min-width:0}.copy strong{display:block;font-size:16px;line-height:1.05;font-weight:700;letter-spacing:-.02em;transition:transform .35s var(--ease)}.copy small{display:block;margin-top:4px;color:inherit;opacity:.72;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.open{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);color:inherit;font-size:18px;transition:transform .35s var(--ease),background .35s ease}
.behance{background:linear-gradient(145deg,#1769ff,#0d3c94)}.linkedin{background:linear-gradient(145deg,#0a66c2,#07345f)}.instagram{background:linear-gradient(145deg,#833ab4,#e1306c 50%,#f77737)}.github{background:linear-gradient(145deg,#2b3137,#0d1117)}.pinterest{background:linear-gradient(145deg,#e60023,#860014)}.cv{background:linear-gradient(145deg,#4b4b50,#242429)}.email{background:linear-gradient(145deg,#38383b,#171719)}
.cv-card.active{height:202px}.cv-actions{position:absolute;z-index:2;left:16px;right:16px;bottom:14px;display:flex;gap:8px;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .28s ease,transform .38s var(--ease)}.cv-card.active .cv-actions{opacity:1;pointer-events:auto;transform:translateY(0)}.cv-option{flex:1;min-height:42px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;font-size:12px;font-weight:600;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}.cv-option:active{background:rgba(255,255,255,.15)}
.status{min-height:16px;margin-top:10px;text-align:center;color:#8e8e93;font-size:11px}.hint{margin-top:8px;text-align:center;color:#65656a;font-size:11px}footer{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;gap:12px;color:#505055;font-size:11px}
body.loading .profile-card{opacity:0;filter:blur(10px);transform:translateY(26px) scale(.985)}body.loading .card{opacity:0;filter:blur(8px);transform:translateY(28px)}body.loading .card[data-order="0"]{transition-delay:.08s}body.loading .card[data-order="1"]{transition-delay:.14s}body.loading .card[data-order="2"]{transition-delay:.20s}body.loading .card[data-order="3"]{transition-delay:.26s}body.loading .card[data-order="4"]{transition-delay:.32s}body.loading .card[data-order="5"]{transition-delay:.38s}body.loading .card[data-order="6"]{transition-delay:.44s}
@media(max-width:560px){.profile-card,.profile-inner{min-height:340px}.logo-ring{width:98px;height:98px}.profile-role{font-size:14px}.stack-section{margin-top:-30px}.wallet{height:540px}.card{--peek:56px;--base:-20px;height:122px}.card.active{height:152px}.cv-card.active{height:194px}.card.shifted{transform:translateY(var(--shift,30px))}.card.active .row{transform:translateY(16px)}.row{padding:68px 14px 12px}.icon{width:40px;height:40px;flex-basis:40px}.copy strong{font-size:15px}.copy small{font-size:11px}footer{flex-direction:column;align-items:center;text-align:center;gap:4px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}body.loading .profile-card,body.loading .card{opacity:1;filter:none;transform:none}}
</style></head>
<body><main class="page"><section class="profile-card" id="profileCard"><div class="profile-inner"><div class="logo-ring"><img id="profileLogo" src="IMG_0271.jpg" alt="BEY logo"></div><h1 class="profile-name" id="profileName">Burhan Emin Yenier</h1><p class="profile-role" id="profileRole">Graphic Designer · 3D Artist · Game Developer</p><div class="profile-chip" id="profileChip">CREATIVE PROFILE</div></div></section>
<section class="stack-section"><div class="wallet" id="wallet"></div><div class="status" id="status"></div><div class="hint" id="hint">Tap once to expand downward · tap outside to close · tap again to open</div></section><footer><span id="footerLeft">© 2026 Burhan Emin Yenier</span><span id="footerRight">Ankara · Türkiye</span></footer></main>
<script>
const DEFAULT_CONFIG={"version":1,"profile":{"name":"Burhan Emin Yenier","role":"Graphic Designer · 3D Artist · Game Developer","chip":"CREATIVE PROFILE","logo":"IMG_0271.jpg"},"theme":{"pageBackground":"#000000","profileColor1":"#171719","profileColor2":"#080809","profileText":"#f5f5f7"},"cards":[{"id":"behance","label":"Behance","subtitle":"buremiyen","url":"https://www.behance.net/buremiyen","icon":"behance","color1":"#1769ff","color2":"#0d3c94","textColor":"#ffffff","enabled":true},{"id":"linkedin","label":"LinkedIn","subtitle":"buremiyen","url":"https://www.linkedin.com/in/buremiyen","icon":"linkedin","color1":"#0a66c2","color2":"#07345f","textColor":"#ffffff","enabled":true},{"id":"instagram","label":"Instagram","subtitle":"@buremiyen","url":"https://www.instagram.com/buremiyen","icon":"instagram","color1":"#833ab4","color2":"#f77737","textColor":"#ffffff","enabled":true},{"id":"github","label":"GitHub","subtitle":"@buremiyen","url":"https://github.com/buremiyen","icon":"github","color1":"#2b3137","color2":"#0d1117","textColor":"#ffffff","enabled":true},{"id":"pinterest","label":"Pinterest","subtitle":"@byenierart","url":"https://tr.pinterest.com/byenierart/","icon":"pinterest","color1":"#e60023","color2":"#860014","textColor":"#ffffff","enabled":true},{"id":"cv","label":"CV / Resume","subtitle":"Türkçe · English","url":"","icon":"cv","color1":"#4b4b50","color2":"#242429","textColor":"#ffffff","enabled":true,"type":"cv","actions":[{"label":"Türkçe CV ↗","url":"cv-tr.html"},{"label":"English CV ↗","url":"cv-en.html"}]},{"id":"email","label":"Email","subtitle":"byenier.art@gmail.com","url":"mailto:byenier.art@gmail.com","icon":"email","color1":"#38383b","color2":"#171719","textColor":"#ffffff","enabled":true}],"footer":{"left":"© 2026 Burhan Emin Yenier","right":"Ankara · Türkiye"},"ui":{"hint":"Tap once to expand downward · tap outside to close · tap again to open"}};
const wallet=document.getElementById('wallet');
const status=document.getElementById('status');
let cards=[];
let active=null;

function iconHTML(type){
  const icons={
    behance:'<span class="behance-mark">Bē</span>',
    linkedin:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>',
    instagram:'<svg class="stroke" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.25" y="3.25" width="17.5" height="17.5" rx="5.25"/><circle cx="12" cy="12" r="4.1"/><circle cx="17.35" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>',
    github:'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 4.69c.68 0 1.37.09 2.01.27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>',
    pinterest:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.08 3.16 9.42 7.62 11.16-.1-.95-.2-2.4.04-3.44.22-.94 1.4-5.96 1.4-5.96s-.35-.72-.35-1.78c0-1.66.96-2.91 2.16-2.91 1.02 0 1.52.77 1.52 1.69 0 1.03-.65 2.56-.99 3.99-.29 1.19.6 2.16 1.77 2.16 2.13 0 3.77-2.24 3.77-5.48 0-2.86-2.06-4.87-5.01-4.87-3.41 0-5.41 2.56-5.41 5.2 0 1.03.39 2.14.89 2.74.1.12.11.23.08.35-.09.38-.29 1.2-.33 1.36-.05.22-.17.27-.4.17-1.5-.69-2.43-2.88-2.43-4.65 0-3.77 2.75-7.25 7.92-7.25 4.16 0 7.39 2.97 7.39 6.92 0 4.14-2.61 7.46-6.23 7.46-1.21 0-2.36-.63-2.76-1.38l-.75 2.85c-.27 1.05-1 2.35-1.49 3.15 1.12.34 2.31.53 3.55.53 6.61 0 11.99-5.37 11.99-11.99C24 5.37 18.63 0 12 0z"/></svg>',
    cv:'<svg class="stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h7l4 4v13h-11z"/><path d="M13.5 3.5v4h4"/><path d="M9 12h6M9 15h6"/></svg>',
    email:'<svg class="stroke" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.25" y="5.25" width="17.5" height="13.5" rx="2.75"/><path d="m4.6 7.15 6.15 4.85a2 2 0 0 0 2.5 0l6.15-4.85"/></svg>',
    youtube:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/></svg>',
    tiktok:'<span style="font-size:22px;font-weight:800">♪</span>',
    link:'<svg class="stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/></svg>'
  };
  return icons[type]||icons.link;
}

function clearActive(){
  cards.forEach(c=>{c.classList.remove('active','shifted');c.style.removeProperty('--shift')});
  active=null;
  status.textContent='';
}

function bindCard(card,item,index){
  card.addEventListener('click',e=>{
    e.stopPropagation();
    if(active===card){
      if(item.type==='cv'){clearActive();return}
      if(item.url){
        if(item.url.startsWith('mailto:')) location.href=item.url;
        else window.open(item.url,'_blank','noopener,noreferrer');
      }
      return;
    }
    const shiftAmount=item.type==='cv'?76:30;
    cards.forEach((c,i)=>{
      c.classList.remove('active','shifted');
      c.style.removeProperty('--shift');
      if(i>index){c.classList.add('shifted');c.style.setProperty('--shift',shiftAmount+'px')}
    });
    card.classList.add('active');
    active=card;
    status.textContent=item.type==='cv'?'Choose a CV language':'Selected · tap again to open';
  });
}

function render(config){
  const p=config.profile||DEFAULT_CONFIG.profile;
  const t=config.theme||DEFAULT_CONFIG.theme;
  document.documentElement.style.setProperty('--page-bg',t.pageBackground||'#000000');
  document.getElementById('profileName').textContent=p.name||'';
  document.getElementById('profileRole').textContent=p.role||'';
  const chip=document.getElementById('profileChip');
  chip.textContent=p.chip||'';
  chip.style.display=p.chip?'block':'none';
  const logo=document.getElementById('profileLogo');
  logo.src=p.logo||'IMG_0271.jpg';
  logo.alt=(p.name||'BEY')+' logo';
  const profileCard=document.getElementById('profileCard');
  profileCard.style.background='radial-gradient(circle at 50% 18%,rgba(255,255,255,.10),transparent 22%),radial-gradient(circle at 14% 12%,rgba(255,255,255,.05),transparent 24%),linear-gradient(145deg,'+(t.profileColor1||'#171719')+','+(t.profileColor2||'#080809')+')';
  profileCard.style.color=t.profileText||'#f5f5f7';
  document.title=p.name||'Portfolio';

  wallet.innerHTML='';
  const visible=(config.cards||[]).filter(x=>x.enabled!==false);
  visible.forEach((item,index)=>{
    const card=document.createElement('article');
    card.className='card'+(item.type==='cv'?' cv cv-card':'');
    card.dataset.order=index;
    card.dataset.type=item.type||'link';
    card.style.setProperty('--i',index);
    card.style.zIndex=String(visible.length-index);
    card.style.background='linear-gradient(145deg,'+(item.color1||'#333')+','+(item.color2||item.color1||'#111')+')';
    card.style.color=item.textColor||'#fff';

    const row=document.createElement('div');row.className='row';
    const left=document.createElement('div');left.className='left';
    const icon=document.createElement('div');icon.className='icon';icon.innerHTML=iconHTML(item.icon);
    const copy=document.createElement('div');copy.className='copy';
    const strong=document.createElement('strong');strong.textContent=item.label||'Link';
    const small=document.createElement('small');small.textContent=item.subtitle||'';
    copy.append(strong,small);left.append(icon,copy);
    const open=document.createElement('div');open.className='open';open.textContent=item.type==='cv'?'⌄':'↗';
    row.append(left,open);card.append(row);

    if(item.type==='cv'){
      const actions=document.createElement('div');actions.className='cv-actions';
      (item.actions||[]).forEach(a=>{
        const link=document.createElement('a');link.className='cv-option';link.href=a.url||'#';link.target='_blank';link.rel='noreferrer';link.textContent=a.label||'Open';
        link.addEventListener('click',e=>e.stopPropagation());
        actions.appendChild(link);
      });
      card.appendChild(actions);
    }
    wallet.appendChild(card);
  });
  cards=[...wallet.querySelectorAll('.card')];
  cards.forEach((card,index)=>bindCard(card,visible[index],index));
  const peek=window.matchMedia('(max-width:560px)').matches?56:58;
  wallet.style.height=Math.max(window.matchMedia('(max-width:560px)').matches?500:520,180+visible.length*peek)+'px';
  const ft=config.footer||{};
  document.getElementById('footerLeft').textContent=ft.left||'';
  document.getElementById('footerRight').textContent=ft.right||'';
  document.getElementById('hint').textContent=(config.ui&&config.ui.hint)||'';
  clearActive();
}

wallet.addEventListener('click',e=>{if(e.target===wallet)clearActive()});
document.addEventListener('click',e=>{if(!wallet.contains(e.target))clearActive()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')clearActive()});

render(DEFAULT_CONFIG);
fetch('site-config.json?v='+Date.now(),{cache:'no-store'})
  .then(r=>r.ok?r.json():Promise.reject(new Error('config')))
  .then(render)
  .catch(()=>{});
</script></body><!-- pages-redeploy-trigger -->
</html>
